name: release

# Distribution, and only distribution: ship an already-built release-N to the
# stores. It builds nothing -- build.yml builds and packages on every merge of staging into main
# and publishes the GitHub Release; this workflow downloads that release's
# signed .aab and .ipa and ships exactly those files.
#
# Order, one job after another, stopping at the first failure:
#   resolve -> play -> appstore-upload -> appstore-submit
# A store job is skipped only when it was not selected. Every other outcome of a
# job before it -- failure, cancellation, or a skip caused by one -- stops
# everything after it, and the run fails.
#
# Each store step ends by reading the store back and failing unless it shows
# exactly what was shipped. Temporary errors (HTTP 429/5xx, network failures)
# are retried three times (10s, 30s, 90s), then fail.
#
# Apple allows one version in review at a time. If an earlier version is still
# waiting for or in review, appstore-submit withdraws it and submits this one,
# and the log says exactly what it withdrew and what it submitted.
#
# What neither store exposes an API for (one-time console work, see
# docs/STORE-SETUP.md): Play's content rating, target audience, category and
# price, and the closed-testing gate for production access; Apple's App Privacy
# label.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to ship, e.g. release-36 (blank = the newest release-N)'
        type: string
        default: ''
      stores:
        description: 'Which stores to ship to'
        type: choice
        options: [both, play, appstore]
        default: both
      android_track:
        description: 'Play track (alpha = closed testing, beta = open testing)'
        type: choice
        options: [internal, alpha, beta, production]
        default: alpha
      rollout:
        description: 'Play staged rollout fraction for non-internal tracks, e.g. 0.2 (blank = everyone)'
        type: string
        default: ''
      push_listing:
        description: 'Push listing text + screenshots from the repo to both stores'
        type: boolean
        default: true
      dry_run:
        description: 'DRY RUN: print every store API call and change nothing'
        type: boolean
        default: false

# A dry run is labelled as one everywhere it appears, so it can never be read
# as a release.
run-name: ${{ inputs.dry_run && 'DRY RUN - release (nothing shipped)' || format('release {0} -> {1}', inputs.tag || 'newest', inputs.stores) }}

permissions:
  contents: read

# Serialised against itself: two concurrent edits of the same Play app would
# clobber each other, and Apple holds one submission at a time.
concurrency:
  group: release
  cancel-in-progress: false

# bash -eo pipefail for every step: a failing command, including one inside a
# pipe, fails its step.
defaults:
  run:
    shell: bash

env:
  DRY: ${{ inputs.dry_run }}

jobs:
  resolve:
    name: resolve the release
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.pick.outputs.build }}
      tag: ${{ steps.pick.outputs.tag }}
      do_play: ${{ steps.pick.outputs.do_play }}
      do_appstore: ${{ steps.pick.outputs.do_appstore }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        env:
          REQUESTED: ${{ inputs.tag }}
          STORES: ${{ inputs.stores }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$REQUESTED" ]; then
            tag="$REQUESTED"
          else
            tag=$(git tag --list 'release-*' | sort -t- -k2 -n | tail -1)
          fi
          build="${tag#release-}"
          case "$build" in
            ''|*[!0-9]*) echo "::error::'$tag' is not a release-N tag"; exit 1 ;;
          esac
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
            || { echo "::error::no $tag tag"; exit 1; }
          # The files this workflow ships must be on the GitHub Release.
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          need=""
          case "$STORES" in both|play)     need="$need -android.aab" ;; esac
          case "$STORES" in both|appstore) need="$need -ios-arm64.ipa" ;; esac
          for suffix in $need; do
            echo "$assets" | grep -q -- "build-$build$suffix\$" \
              || { echo "::error::$tag has no *build-$build$suffix asset"; exit 1; }
          done
          {
            echo "build=$build"
            echo "tag=$tag"
            echo "do_play=$([ "$STORES" != appstore ] && echo true || echo false)"
            echo "do_appstore=$([ "$STORES" != play ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          {
            [ "$DRY" = true ] && echo "## DRY RUN: nothing will be shipped"
            echo "Shipping **$tag** (build $build) to: $STORES"
          } >> "$GITHUB_STEP_SUMMARY"

  play:
    name: Google Play
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.do_play == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - name: Require the service-account secret
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$SA" ] || { echo "::error::missing secret PLAY_SERVICE_ACCOUNT_JSON"; exit 1; }
      - name: Download the AAB from the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          BUILD: ${{ needs.resolve.outputs.build }}
        run: |
          for delay in 10 30 90 0; do
            gh release download "$TAG" -p "*-build-$BUILD-android.aab" -D dist --clobber && break
            [ "$delay" = 0 ] && { echo "::error::could not download the AAB after 3 retries"; exit 1; }
            echo "download failed; retrying in ${delay}s"; sleep "$delay"
          done
          ls -l dist/*.aab
      - name: Install the JWT dependency
        run: python3 -m pip install --quiet cryptography
      - name: Validate the listing files
        if: ${{ inputs.push_listing }}
        run: python3 scripts/store_listing.py --check
      # Bundle, listing and track in ONE edit, so they reach review together.
      - name: Release onto the chosen track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          BUILD: ${{ needs.resolve.outputs.build }}
          TRACK: ${{ inputs.android_track }}
          ROLLOUT: ${{ inputs.rollout }}
          LISTING: ${{ inputs.push_listing }}
        run: |
          aab=$(ls dist/*.aab)
          args=(release --build "$BUILD" --upload "$aab" --track "$TRACK")
          if [ "$LISTING" = "true" ]; then args+=(--with-listing); fi
          if [ -n "$ROLLOUT" ]; then args+=(--rollout "$ROLLOUT"); fi
          if [ "$DRY" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/play_release.py "${args[@]}"
      - name: Read the track back
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          BUILD: ${{ needs.resolve.outputs.build }}
          TRACK: ${{ inputs.android_track }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          if [ "$DRY" = "true" ]; then
            echo "DRY RUN: nothing was committed, so there is nothing to read back"
            python3 scripts/play_release.py status
            exit 0
          fi
          want=completed
          if [ -n "$ROLLOUT" ] && [ "$TRACK" != internal ]; then want=inProgress; fi
          python3 scripts/play_release.py verify --build "$BUILD" --track "$TRACK" --status "$want"
          python3 scripts/play_release.py status

  # Upload on macOS, because altool ships with Xcode. Skipped (with a log line)
  # when App Store Connect already has this build -- each build number can be
  # uploaded only once.
  appstore-upload:
    name: App Store - upload the .ipa
    needs: [resolve, play]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.do_appstore == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (needs.play.result == 'success' || needs.resolve.outputs.do_play == 'false') }}
    runs-on: macos-26
    timeout-minutes: 25
    outputs:
      ios_build: ${{ steps.ipa.outputs.ios_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - name: Require the App Store Connect secrets
        env:
          K: ${{ secrets.ASC_KEY_P8 }}
          I: ${{ secrets.ASC_KEY_ID }}
          S: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          missing=""
          [ -n "$K" ] || missing="$missing ASC_KEY_P8"
          [ -n "$I" ] || missing="$missing ASC_KEY_ID"
          [ -n "$S" ] || missing="$missing ASC_ISSUER_ID"
          [ -z "$missing" ] || { echo "::error::missing secret(s):$missing"; exit 1; }
      # The .ipa's own CFBundleVersion is the build number App Store Connect
      # knows it by. It is the release number, except where a repo's build
      # had to step past a number Apple already held; read it, never assume.
      - name: Download the .ipa from the GitHub Release
        id: ipa
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          BUILD: ${{ needs.resolve.outputs.build }}
        run: |
          for delay in 10 30 90 0; do
            gh release download "$TAG" -p "*-build-$BUILD-ios-arm64.ipa" -D dist --clobber && break
            [ "$delay" = 0 ] && { echo "::error::could not download the .ipa after 3 retries"; exit 1; }
            echo "download failed; retrying in ${delay}s"; sleep "$delay"
          done
          ipa=$(ls dist/*.ipa)
          unzip -l "$ipa" | grep -q '_CodeSignature' \
            || { echo "::error::$ipa is not signed"; exit 1; }
          unzip -p "$ipa" 'Payload/*.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
          v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/Info.plist")
          short=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/Info.plist")
          case "$v" in ''|*[!0-9]*) echo "::error::$ipa has CFBundleVersion '$v'"; exit 1 ;; esac
          [ "$v" -ge "$BUILD" ] || { echo "::error::$ipa is build $v, below release $BUILD"; exit 1; }
          [ "$short" = "1.0.$v" ] || { echo "::error::$ipa is version $short, not 1.0.$v"; exit 1; }
          echo "ios_build=$v" >> "$GITHUB_OUTPUT"
          echo "release $BUILD -> iOS build $v (version $short)"
      # macOS runners' Homebrew Python refuses bare pip installs (PEP 668), so
      # the dependency goes into a virtual environment.
      - name: Install the JWT dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check cryptography
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Check whether App Store Connect already has this build
        id: state
        env:
          ASC_KEY_P8:    ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD: ${{ steps.ipa.outputs.ios_build }}
        run: |
          state=$(python3 scripts/asc_release.py build-state --build "$BUILD")
          echo "App Store Connect build $BUILD: $state"
          case "$state" in
            ABSENT)            echo "upload=true"  >> "$GITHUB_OUTPUT" ;;
            PROCESSING|VALID)  echo "upload=false" >> "$GITHUB_OUTPUT"
                               echo "build $BUILD is already in App Store Connect ($state); not re-uploading" ;;
            *)                 echo "::error::build $BUILD is $state in App Store Connect"; exit 1 ;;
          esac
      # altool finds the key by convention: AuthKey_<KeyID>.p8 in ~/.appstoreconnect/private_keys.
      - name: Install the App Store Connect API key
        if: ${{ steps.state.outputs.upload == 'true' && !inputs.dry_run }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/"AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 ~/.appstoreconnect/private_keys/"AuthKey_${ASC_KEY_ID}.p8"
      # Validate first (better messages, no build number burned), then upload.
      # Only a network-level failure is retried; anything Apple rejects fails.
      - name: Validate and upload the .ipa
        if: ${{ steps.state.outputs.upload == 'true' }}
        env:
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ipa=$(ls dist/*.ipa)
          if [ "$DRY" = "true" ]; then
            echo "DRY RUN: would validate and upload $ipa"
            exit 0
          fi
          altool_retry() {
            for delay in 10 30 90 0; do
              if xcrun altool "$@" -f "$ipa" -t ios --apiKey "$ASC_KEY_ID" \
                   --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"; then
                return 0
              fi
              if [ "$delay" != 0 ] && grep -qiE 'timed out|network|NSURLErrorDomain|-100[19]|HTTP status code: 5[0-9][0-9]|Unable to connect' "$RUNNER_TEMP/altool.log"; then
                echo "altool $1: temporary error; retrying in ${delay}s"; sleep "$delay"; continue
              fi
              return 1
            done
            return 1
          }
          altool_retry --validate-app
          altool_retry --upload-app
          echo "Uploaded build ${{ steps.ipa.outputs.ios_build }}."
      - name: Remove the API key
        if: ${{ always() }}
        run: rm -rf ~/.appstoreconnect/private_keys

  # Linux (pure REST): wait out Apple's processing, put the build in front of
  # internal testers with notes, replace any pending review, submit, read back.
  appstore-submit:
    name: App Store - TestFlight + App Review
    needs: [resolve, play, appstore-upload]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.do_appstore == 'true' && needs.appstore-upload.result == 'success' }}
    runs-on: ubuntu-22.04
    # Inside this: up to 30 min for Apple to process the screenshots (with
    # re-uploads) and 10 min of "not ready yet" retries on the submit.
    timeout-minutes: 90
    env:
      ASC_KEY_P8:    ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # The iOS build number, as read from the .ipa (see appstore-upload).
      BUILD: ${{ needs.appstore-upload.outputs.ios_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - name: Install the JWT dependency
        run: python3 -m pip install --quiet cryptography
      - name: Validate the listing files
        if: ${{ inputs.push_listing }}
        run: python3 scripts/store_listing.py --check
      - name: TestFlight - wait for processing, attach notes, check internal testers
        env:
          BUILD_VERSION: ${{ needs.appstore-upload.outputs.ios_build }}
          NOTES: ${{ needs.resolve.outputs.tag }}
        run: |
          if [ "$DRY" = "true" ]; then
            echo "DRY RUN: would wait for build $BUILD, attach notes and check internal testers"
            exit 0
          fi
          BUNDLE_ID=$(python3 -c "import plistlib;print(plistlib.load(open('ios/Info.plist','rb'))['CFBundleIdentifier'])")
          export BUNDLE_ID
          python3 scripts/testflight_notes.py
      # Order matters: Apple hangs the listing off a VERSION record, so the
      # version is created (after replacing any pending review) first, then the
      # listing is written onto it, then it is submitted.
      - name: Replace any pending review, create version 1.0.N, attach the build
        run: |
          args=(release --build "$BUILD")
          if [ "$DRY" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/asc_release.py "${args[@]}"
      - name: Push the store listing
        if: ${{ inputs.push_listing }}
        run: |
          args=(listing)
          if [ "$DRY" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/asc_release.py "${args[@]}"
      - name: Submit for App Review
        run: |
          args=(release --build "$BUILD" --submit)
          if [ "$DRY" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/asc_release.py "${args[@]}"
      - name: Read the version back
        run: |
          if [ "$DRY" = "true" ]; then
            echo "DRY RUN: nothing was submitted, so there is nothing to read back"
            python3 scripts/asc_release.py status
            exit 0
          fi
          python3 scripts/asc_release.py verify-submitted --build "$BUILD"
          python3 scripts/asc_release.py status
