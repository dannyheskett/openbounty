name: release

# Runs automatically on every push to main (i.e. when a PR merges), and can also be
# triggered manually from the Actions tab. Auto-picks the next sequential release-N tag,
# builds Linux x86_64, Windows x64+x86, macOS universal and the WebAssembly bundle,
# packages each into the user-facing archive (binary + README + LICENSE + NOTICES, NO
# .openbounty pack), and publishes a GitHub Release with the archives + auto notes.
#
# Docs-only merges are skipped. paths-ignore is safe HERE -- unlike in ci.yml, nothing
# requires these checks, so a skipped run blocks nothing.
#
# The tag is created in the publish job AFTER all builds succeed, so a failed build leaves N
# unused and the next run reuses it. The triggering commit SHA is captured up front and used
# everywhere, so a mid-build push to main does not affect what gets tagged.
#
# This workflow ends at the GitHub Release. It does NOT touch danheskett.com: the site pulls
# the published web bundle from releases/latest at its own build time, so nothing here holds
# a cross-repo write token.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.editorconfig'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch: {}

permissions:
  contents: write   # create tag + publish release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    uses: ./.github/workflows/attribution-guard.yml
    permissions:
      contents: write

  prepare:
    needs: guard
    name: compute next release number
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.next.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        run: |
          # Find max N across existing release-N tags; default to 0.
          last=$(git tag --list 'release-*' \
                   | sed -n 's/^release-\([1-9][0-9]*\)$/\1/p' \
                   | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA"  >> "$GITHUB_OUTPUT"
          echo "Next release: release-$next at $GITHUB_SHA"

  build-linux-windows:
    name: linux + windows builds
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux + mingw deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # mingw side is C99 only: the two mingw C compilers + binutils, NOT the
          # `mingw-w64` metapackage (which pulls the g++ toolchain for both arches x
          # posix/win32 + perl -- 39 packages / 241 MB of unused C++).
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils-mingw-w64 \
            zip
      - name: Rebuild raylib against runner glibc (Linux)
        run: ./scripts/build_raylib_linux.sh
      - name: Run tests
        # `make test` runs the FULL greatest suite: unit, e2e, autoplay, and the regression
        # combat-formula digests + save fixtures.
        run: make test RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Rebuild raylib for mingw (win64 + win32)
        run: ./scripts/build_raylib_windows.sh
      - name: Build release binaries (Linux + Windows)
        run: make release windows RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Package archives
        run: make dist-linux dist-windows RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Verify no .openbounty pack in release archives
        run: |
          set -e
          fail=0
          for f in dist/*.tar.gz; do
            if tar -tzf "$f" | grep -q '\.openbounty$'; then
              echo "FAIL: $f contains a .openbounty pack file"
              fail=1
            fi
          done
          for f in dist/*.zip; do
            if unzip -l "$f" | grep -q '\.openbounty$'; then
              echo "FAIL: $f contains a .openbounty pack file"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]
      - uses: actions/upload-artifact@v7
        with:
          name: linux-windows
          path: |
            dist/*.tar.gz
            dist/*.zip

  build-mac:
    name: macOS universal build
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild raylib universal (arm64 + x86_64)
        run: ./scripts/build_raylib_mac.sh
      - name: Build universal binary
        run: make mac RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Package archive
        run: make dist-mac RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Verify no .openbounty pack in release archive
        run: |
          set -e
          fail=0
          for f in dist/*.zip; do
            if unzip -l "$f" | grep -q '\.openbounty$'; then
              echo "FAIL: $f contains a .openbounty pack file"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/*.zip

  build-web:
    name: web (WASM) build
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
      # The web target needs the LINUX toolchain too, which is not obvious: $(OUT_WEB)
      # depends on $(WEB_PACK), and the pack rule runs `./build/debug/openbounty --pack-dir`
      # -- the native binary is what zips the pack embedded in openbounty.data. So building
      # the wasm transitively builds the Linux game first. zip is for dist-web.
      - name: Install Linux build deps + zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev \
            zip
      - name: Rebuild raylib against runner glibc (Linux)
        run: ./scripts/build_raylib_linux.sh
      - name: Build raylib (web)
        run: ./scripts/build_raylib_web.sh
      # RELEASE_VERSION must be passed HERE, not only to dist-web: it bakes build/version.h
      # into the wasm. Packaging later with a different value would just rezip a binary
      # carrying the wrong version.
      - name: Build WASM
        run: make web RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Package WASM bundle
        run: make dist-web RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      # Same belt-and-braces check the desktop jobs run. It passes by design: the pack rides
      # inside openbounty.data, which is the intended embedding -- what must never ship is a
      # loose *.openbounty file.
      - name: Verify no .openbounty pack in release archive
        run: |
          set -e
          fail=0
          for f in dist/*.zip; do
            if unzip -l "$f" | grep -q '\.openbounty$'; then
              echo "FAIL: $f contains a .openbounty pack file"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/*.zip

  publish:
    name: tag + publish GitHub Release
    needs: [prepare, build-linux-windows, build-mac, build-web]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-merged
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist-merged/
      - name: Create release-N tag at the dispatched commit
        env:
          V: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "release-$V" "$SHA"
          git push origin "release-$V"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ needs.prepare.outputs.version }}
          name: release-${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: dist-merged/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
