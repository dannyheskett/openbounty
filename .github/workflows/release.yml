name: release

# Inlined, not called. The shared copy in dannyheskett/.github is being retired, so this
# repository carries its own. The body below is that workflow verbatim, with the edits the
# shared form existed to avoid needing:
#   - workflow_call becomes this repo's real push + workflow_dispatch triggers
#   - the `platforms` input and its per-job gates are gone; a platform this repo does not
#     build is simply not a job
#   - `play_publish` and the publish-play job are gone; this repo ships no Android bundle
#   - the pack guard steps are unconditional, the `verify_no_pack` input having no other
#     caller to be false for
#
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.editorconfig'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify everything; tag nothing, publish nothing'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    uses: ./.github/workflows/attribution-guard.yml
    permissions:
      contents: write

  prepare:
    needs: guard
    name: compute next release number
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.next.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        run: |
          # Find max N across existing release-N tags; default to 0.
          last=$(git tag --list 'release-*' \
                   | sed -n 's/^release-\([1-9][0-9]*\)$/\1/p' \
                   | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA"  >> "$GITHUB_OUTPUT"
          echo "Next release: release-$next at $GITHUB_SHA"

  build-linux-windows:
    name: linux + windows builds
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux + mingw deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils-mingw-w64 \
            zip
      - name: Build raylib (Linux)
        run: ./scripts/build_raylib_linux.sh
      - name: Run tests
        run: make test RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Build raylib (mingw win64 + win32)
        run: ./scripts/build_raylib_windows.sh
      - name: Package Linux + Windows archives
        run: make dist-linux dist-windows RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Verify no loose pack file in the archives
        run: |
          set -e
          # Escaped dot: an unescaped "." matches any character, so ".openbounty$"
          # also matched "openbounty-build-13/openbounty" -- the binary itself.
          pat="\\.${{ github.event.repository.name }}$"
          fail=0
          # tar/unzip's status must be tested on its own. Inside an `if` condition the
          # pipeline's status is consumed as the condition's truth value, so a corrupt or
          # truncated archive made the lister fail, grep report "no match", and the guard
          # pass clean. `set -o pipefail` does not help here for the same reason.
          for f in dist/*.tar.gz; do
            [ -e "$f" ] || continue
            if ! listing=$(tar -tzf "$f" 2>/dev/null); then
              echo "FAIL: cannot read $f"; fail=1; continue
            fi
            if printf '%s\n' "$listing" | grep -qE "$pat"; then
              echo "FAIL: $f contains a pack file matching $pat"; fail=1
            fi
          done
          for f in dist/*.zip; do
            [ -e "$f" ] || continue
            if ! listing=$(unzip -l "$f" 2>/dev/null); then
              echo "FAIL: cannot read $f"; fail=1; continue
            fi
            if printf '%s\n' "$listing" | grep -qE "$pat"; then
              echo "FAIL: $f contains a pack file matching $pat"; fail=1
            fi
          done
          [ "$fail" -eq 0 ]
      - uses: actions/upload-artifact@v7
        with:
          name: linux-windows
          path: |
            dist/*.tar.gz
            dist/*.zip

  build-mac:
    name: macOS universal build
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build raylib (universal arm64 + x86_64)
        run: ./scripts/build_raylib_mac.sh
      - name: Package macOS archive
        run: make dist-mac RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Verify no loose pack file in the archive
        run: |
          set -e
          # Escaped dot: an unescaped "." matches any character, so ".openbounty$"
          # also matched "openbounty-build-13/openbounty" -- the binary itself.
          pat="\\.${{ github.event.repository.name }}$"
          fail=0
          # tar/unzip's status must be tested on its own. Inside an `if` condition the
          # pipeline's status is consumed as the condition's truth value, so a corrupt or
          # truncated archive made the lister fail, grep report "no match", and the guard
          # pass clean. `set -o pipefail` does not help here for the same reason.
          for f in dist/*.zip; do
            [ -e "$f" ] || continue
            if ! listing=$(unzip -l "$f" 2>/dev/null); then
              echo "FAIL: cannot read $f"; fail=1; continue
            fi
            if printf '%s\n' "$listing" | grep -qE "$pat"; then
              echo "FAIL: $f contains a pack file matching $pat"; fail=1
            fi
          done
          [ "$fail" -eq 0 ]
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/*.zip

  build-web:
    name: web (WASM) build
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
      # See game-ci.yml: the web target can transitively need the native Linux build.
      - name: Install Linux build deps + zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev \
            zip
      - name: Build raylib (Linux)
        run: ./scripts/build_raylib_linux.sh
      - name: Build raylib (web)
        run: ./scripts/build_raylib_web.sh
      # RELEASE_VERSION must be passed HERE, not only to dist-web: it can bake a version
      # header into the wasm. Packaging later with a different value would rezip a binary
      # carrying the wrong version.
      - name: Build WASM
        run: make web RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Package WASM bundle
        run: make dist-web RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Verify no loose pack file in the archive
        run: |
          set -e
          # Escaped dot: an unescaped "." matches any character, so ".openbounty$"
          # also matched "openbounty-build-13/openbounty" -- the binary itself.
          pat="\\.${{ github.event.repository.name }}$"
          fail=0
          # tar/unzip's status must be tested on its own. Inside an `if` condition the
          # pipeline's status is consumed as the condition's truth value, so a corrupt or
          # truncated archive made the lister fail, grep report "no match", and the guard
          # pass clean. `set -o pipefail` does not help here for the same reason.
          for f in dist/*.zip; do
            [ -e "$f" ] || continue
            if ! listing=$(unzip -l "$f" 2>/dev/null); then
              echo "FAIL: cannot read $f"; fail=1; continue
            fi
            if printf '%s\n' "$listing" | grep -qE "$pat"; then
              echo "FAIL: $f contains a pack file matching $pat"; fail=1
            fi
          done
          [ "$fail" -eq 0 ]
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/*.zip

  build-android:
    name: android APK (sideload) + AAB (Play) build
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      NDK_VERSION: "26.3.11579264"
      ANDROID_BUILD_TOOLS: "36.0.0"
      ANDROID_PLATFORM_VER: "36"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        # The action's default package list includes the legacy `tools`
        # package, which current cmdline-tools no longer carry ("Failed to
        # find package 'tools'"), failing SDK setup. The NDK, build-tools and
        # platform are installed explicitly below.
        with:
          packages: platform-tools
      - name: Install NDK + build-tools + platform
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platforms;android-${ANDROID_PLATFORM_VER}"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      # The APK embeds the Glory of Rome pack, and the pack is zipped by the
      # NATIVE binary (./build/debug/openbounty --pack-dir), so the Linux
      # toolchain is required even though nothing native ships from this job.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev
      - name: Build raylib (Linux)
        run: ./scripts/build_raylib_linux.sh
      - name: Build raylib (Android, arm64-v8a)
        run: ./scripts/build_raylib_android.sh
      - name: Package sideload APK (debug-signed)
        run: |
          make dist-android \
            ANDROID_BUILD_TOOLS="${ANDROID_BUILD_TOOLS}" \
            ANDROID_PLATFORM_VER="${ANDROID_PLATFORM_VER}" \
            RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      # secrets can't be referenced in `if:`, so probe once into an output. All FOUR signing
      # secrets must be present -- the alias and both passwords, not just the keystore. If
      # any is missing the AAB is skipped and the sideload APK still ships, so an incomplete
      # Play config never fails the release.
      - name: Detect Play signing secrets
        id: playsecret
        env:
          K:  ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          A:  ${{ secrets.PLAY_KEY_ALIAS }}
          SP: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          if [ -n "$K" ] && [ -n "$A" ] && [ -n "$SP" ] && [ -n "$KP" ]; then
            echo "present=true"  >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Package Play bundle (AAB, upload-signed)
        if: steps.playsecret.outputs.present == 'true'
        env:
          PLAY_UPLOAD_KEYSTORE:    ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PLAY_KEY_ALIAS:          ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEYSTORE_PASSWORD:  ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_PASSWORD:       ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          echo "$PLAY_UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          make dist-android-play \
            ANDROID_BUILD_TOOLS="${ANDROID_BUILD_TOOLS}" \
            ANDROID_PLATFORM_VER="${ANDROID_PLATFORM_VER}" \
            RELEASE_VERSION=${{ needs.prepare.outputs.version }} \
            PLAY_KEYSTORE="$RUNNER_TEMP/upload.jks" \
            PLAY_KEY_ALIAS="$PLAY_KEY_ALIAS" \
            PLAY_STORE_PASS="$PLAY_KEYSTORE_PASSWORD" \
            PLAY_KEY_PASS="$PLAY_KEY_PASSWORD"
      # The pack inside these artifacts is Glory of Rome, which is ours. The guard the
      # other platforms run is about King's Bounty's DOS-extracted pack: check it is not
      # in here rather than checking for any pack at all.
      - name: Verify no King's Bounty pack in the Android artifacts
        run: |
          set -e
          for f in dist/*.apk dist/*.aab; do
            [ -e "$f" ] || continue
            if unzip -l "$f" | grep -q "kings-bounty"; then
              echo "$f contains the King's Bounty pack"; exit 1
            fi
          done
      # The AAB is only built and uploaded as an artifact here. The push to Play happens in
      # publish-play, which waits for the GitHub Release first: a build failing in parallel
      # with this one could otherwise land on Play after the release had broken.
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            dist/*.apk
            dist/*.aab

  publish:
    name: tag + publish GitHub Release
    needs: [prepare, build-linux-windows, build-mac, build-web, build-android]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.prepare.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-merged
          merge-multiple: true
      - run: ls -la dist-merged/
      # The two publishing steps, and only these, are what `dry_run` withholds. Everything
      # before them still runs, so a dry run proves the build and the packaging without
      # consuming a release number or putting anything in front of a user.
      - name: Create release-N tag at the captured commit
        if: ${{ !inputs.dry_run }}
        env:
          V: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "release-$V" "$SHA"
          git push origin "release-$V"
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ needs.prepare.outputs.version }}
          name: release-${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: dist-merged/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false

  publish-play:
    # Gated on `publish`, not merely on the builds: the GitHub Release is not a platform
    # build, and shipping an AAB labelled release-N for a release that does not exist is
    # exactly what waiting on it prevents.
    #
    # `!inputs.dry_run` is load-bearing, not decorative: without it a dry run would still
    # ship a build to the internal track, the outcome dry_run exists to prevent. On a
    # push, `inputs` is empty and the expression is falsey, which is why it is safe at
    # job level.
    if: ${{ !inputs.dry_run && needs.publish.result == 'success' }}
    name: publish AAB to the Play internal track
    needs: [prepare, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Download the android artifact (contains the AAB)
        uses: actions/download-artifact@v8
        with:
          name: android
          path: dist
      - name: Gate on the publish secret + a built AAB
        id: gate
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          aab=$(find dist -maxdepth 1 -name '*.aab' | head -1)
          if [ -n "$SA" ] && [ -n "$aab" ]; then
            echo "go=true"   >> "$GITHUB_OUTPUT"
            echo "aab=$aab"  >> "$GITHUB_OUTPUT"
          else
            echo "go=false"  >> "$GITHUB_OUTPUT"
            echo "Skipping Play publish (secret: $([ -n "$SA" ] && echo yes || echo no); AAB: $([ -n "$aab" ] && echo yes || echo no))."
          fi
      # Pinned to the v1.1.5 commit SHA (not the mutable tag) so a retagged upstream release
      # cannot silently change what runs against the signing key.
      - name: Publish AAB to the Play internal track
        if: steps.gate.outputs.go == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5  # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # The mobile app is Glory of Rome, not the repository name.
          packageName: com.danheskett.gloryofrome
          releaseFiles: ${{ steps.gate.outputs.aab }}
          track: internal
          status: completed
          releaseName: release-${{ needs.prepare.outputs.version }}
