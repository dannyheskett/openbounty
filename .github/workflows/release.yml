name: release

# Thin caller. All logic lives in dannyheskett/.github, shared by every game repo.
# Every merge to main cuts the next release-N.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.editorconfig'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: dannyheskett/.github/.github/workflows/game-release.yml@v1
    with:
      platforms: '["linux","windows","mac","web"]'
      verify_no_pack: true
    secrets: inherit
