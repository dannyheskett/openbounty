name: release

# This repository's own release workflow, not a call to a shared one: every job runs on
# every release, a platform this repo does not build is simply not a job, and the pack
# guard steps are unconditional. docs/RELEASE-PROCESS.md describes each job.
#
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.editorconfig'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify everything; tag nothing, publish nothing'
        type: boolean
        default: true
      submit_for_review:
        description: 'Also send the build to App Review (off by default: a merge must never submit)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    uses: ./.github/workflows/attribution-guard.yml
    permissions:
      contents: write

  prepare:
    needs: guard
    name: compute next release number
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.next.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        run: |
          # Find max N across existing release-N tags; default to 0.
          last=$(git tag --list 'release-*' \
                   | sed -n 's/^release-\([1-9][0-9]*\)$/\1/p' \
                   | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA"  >> "$GITHUB_OUTPUT"
          echo "Next release: release-$next at $GITHUB_SHA"

  build-linux-windows:
    name: linux + windows builds
    needs: prepare
    runs-on: ubuntu-22.04
    # The full test suite, two raylib builds and both package sets (OpenBounty
    # and Glory of Rome) take ~10m; 10 was the old limit and cut the first
    # full release off at 10m16s.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux + mingw deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils-mingw-w64 \
            zip
      - name: Build raylib (Linux)
        run: ./scripts/build_raylib_linux.sh
      - name: Run tests
        run: make test RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Build raylib (mingw win64 + win32)
        run: ./scripts/build_raylib_windows.sh
      - name: Package Linux + Windows archives (OpenBounty and Glory of Rome)
        run: |
          make dist-linux dist-windows dist-rome-linux dist-rome-windows \
            RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Verify the pack rule (no pack in OpenBounty, Rome's in Glory of Rome)
        run: ./scripts/verify_release_packs.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux-windows
          path: |
            dist/*.tar.gz
            dist/*.zip

  build-mac:
    name: macOS universal build
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build raylib (universal arm64 + x86_64)
        run: ./scripts/build_raylib_mac.sh
      # The Rome pack is zipped by a native binary, and the default one links
      # X11 -- so on macOS the mac build zips it (PACK_TOOL).
      - name: Package macOS archives (OpenBounty and Glory of Rome)
        run: |
          make dist-mac dist-rome-mac PACK_TOOL=build/openbounty-mac \
            RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Verify the pack rule (no pack in OpenBounty, Rome's in Glory of Rome)
        run: ./scripts/verify_release_packs.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/*.zip

  build-web:
    name: web (WASM) build
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
      # See game-ci.yml: the web target can transitively need the native Linux build.
      - name: Install Linux build deps + zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev \
            zip
      - name: Build raylib (Linux)
        run: ./scripts/build_raylib_linux.sh
      - name: Build raylib (web)
        run: ./scripts/build_raylib_web.sh
      # RELEASE_VERSION must be passed HERE, not only to dist-web: it can bake a version
      # header into the wasm. Packaging later with a different value would rezip a binary
      # carrying the wrong version.
      - name: Build WASM
        run: make web RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Package WASM bundle
        run: make dist-web RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Verify the pack rule (no pack in OpenBounty, Rome's in Glory of Rome)
        run: ./scripts/verify_release_packs.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/*.zip

  build-ios:
    name: iOS device .ipa build
    needs: prepare
    # The build number actually uploaded, which can be above the release
    # number (see "Work out the iOS build number"); the TestFlight note and
    # the review submission look the build up by it.
    outputs:
      build: ${{ steps.iosnum.outputs.build || needs.prepare.outputs.version }}
    # macos-26 carries Xcode 26 and the iOS 26 SDK. Apple refuses an upload
    # built against anything older ("This app was built with the iOS 18.5
    # SDK"), which is what macos-15 produced and what failed release-23.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Apple refuses an upload built against an old SDK, and the message only
      # arrives after the whole build and a validation round trip. Fail here.
      - name: Check the iOS SDK is new enough for the App Store
        run: |
          set -eux
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK: $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::iOS SDK $sdk is too old; App Store uploads require 26+. Update the runner image or select a newer Xcode."
            exit 1
          fi
      # The .app embeds the Glory of Rome pack, and the pack is zipped by a
      # native binary, so a macOS build of the game itself comes first. The
      # default target links X11 and is not buildable here.
      - name: Build raylib (macOS)
        run: ./scripts/build_raylib_mac.sh
      - name: Build the pack tool
        run: make mac
      # Signing is opt-in. Without the Apple secrets this still produces the
      # unsigned .ipa, which is useful for a device farm and proves the build.
      - name: Detect iOS signing secrets
        id: iossecret
        env:
          C: ${{ secrets.IOS_CERT_P12 }}
          P: ${{ secrets.IOS_CERT_PASSWORD }}
          M: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          T: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$C" ] && [ -n "$P" ] && [ -n "$M" ] && [ -n "$T" ]; then
            echo "present=true"  >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Package iOS .ipa (unsigned)
        if: steps.iossecret.outputs.present == 'false'
        run: make dist-ios PACK_TOOL=build/openbounty-mac RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      # App Store-submittable .ipa: the distribution certificate goes into a
      # throwaway keychain that dies with the runner, the profile is embedded,
      # and the Makefile writes the entitlements.
      # The build number must be higher than every build App Store Connect
      # already holds -- including builds pushed from a branch by
      # testflight.yml, which take the next free number and so can overtake
      # the release count. release-26 collided with a branch build 26 exactly
      # that way. Take whichever is higher: the release number, or Apple's
      # next free one.
      - name: Work out the iOS build number
        id: iosnum
        if: steps.iossecret.outputs.present == 'true'
        env:
          ASC_KEY_P8:    ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          N:             ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          build="$N"
          if [ -n "$ASC_KEY_P8" ]; then
            python3 -m pip install --quiet --break-system-packages cryptography
            free=$(python3 scripts/asc_next_build.py)
            if [ "$free" -gt "$build" ]; then build="$free"; fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release $N -> iOS build $build"
      - name: Package iOS .ipa (App Store signed)
        if: steps.iossecret.outputs.present == 'true'
        env:
          IOS_CERT_P12:             ${{ secrets.IOS_CERT_P12 }}
          IOS_CERT_PASSWORD:        ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_TEAM_ID:              ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/gloryofrome-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          echo "$IOS_CERT_P12"             | base64 -d > "$RUNNER_TEMP/dist.p12"
          echo "$IOS_PROVISIONING_PROFILE" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -f pkcs12
          # Without this, codesign blocks on an interactive keychain prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Apple Distribution/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "no Apple Distribution identity found in the keychain" >&2
            security find-identity -v -p codesigning "$KEYCHAIN" >&2
            exit 1
          fi
          echo "signing as: $IDENTITY"

          make dist-ios \
            PACK_TOOL=build/openbounty-mac \
            RELEASE_VERSION=${{ needs.prepare.outputs.version }} \
            IOS_BUILD_NUMBER=${{ steps.iosnum.outputs.build }} \
            IOS_VERSION_NAME=1.0.${{ steps.iosnum.outputs.build }} \
            IOS_SIGN_IDENTITY="$IDENTITY" \
            IOS_PROFILE="$RUNNER_TEMP/profile.mobileprovision" \
            IOS_TEAM_ID="$IOS_TEAM_ID"
      - name: Verify the .ipa is signed and App Store-shaped
        if: steps.iossecret.outputs.present == 'true'
        run: |
          set -euo pipefail
          app="build/ios-device/Payload/GloryOfRome.app"
          codesign --verify --strict --verbose=2 "$app"
          echo "--- entitlements ---"
          codesign -d --entitlements :- "$app"
          test -f "$app/embedded.mobileprovision" || { echo "no embedded profile" >&2; exit 1; }
          test -f "$app/Assets.car"               || { echo "no compiled app icon" >&2; exit 1; }
          # Top-level CFBundleIconName, not just the nested one actool writes:
          # missing it fails the upload with ITMS-90713.
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion'  "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app/Info.plist"
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/*.ipa

  build-android:
    name: android APK (sideload) + AAB (Play) build
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      NDK_VERSION: "26.3.11579264"
      ANDROID_BUILD_TOOLS: "36.0.0"
      ANDROID_PLATFORM_VER: "36"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        # The action's default package list includes the legacy `tools`
        # package, which current cmdline-tools no longer carry ("Failed to
        # find package 'tools'"), failing SDK setup. The NDK, build-tools and
        # platform are installed explicitly below.
        with:
          packages: platform-tools
      - name: Install NDK + build-tools + platform
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platforms;android-${ANDROID_PLATFORM_VER}"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      # The APK embeds the Glory of Rome pack, and the pack is zipped by the
      # NATIVE binary (./build/debug/openbounty --pack-dir), so the Linux
      # toolchain is required even though nothing native ships from this job.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev
      - name: Build raylib (Linux)
        run: ./scripts/build_raylib_linux.sh
      - name: Build raylib (Android, arm64-v8a)
        run: ./scripts/build_raylib_android.sh
      - name: Package sideload APK (debug-signed)
        run: |
          make dist-android \
            ANDROID_BUILD_TOOLS="${ANDROID_BUILD_TOOLS}" \
            ANDROID_PLATFORM_VER="${ANDROID_PLATFORM_VER}" \
            RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      # secrets can't be referenced in `if:`, so probe once into an output. All FOUR signing
      # secrets must be present -- the alias and both passwords, not just the keystore. If
      # any is missing the AAB is skipped and the sideload APK still ships, so an incomplete
      # Play config never fails the release.
      - name: Detect Play signing secrets
        id: playsecret
        env:
          K:  ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          A:  ${{ secrets.PLAY_KEY_ALIAS }}
          SP: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          if [ -n "$K" ] && [ -n "$A" ] && [ -n "$SP" ] && [ -n "$KP" ]; then
            echo "present=true"  >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Package Play bundle (AAB, upload-signed)
        if: steps.playsecret.outputs.present == 'true'
        env:
          PLAY_UPLOAD_KEYSTORE:    ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PLAY_KEY_ALIAS:          ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEYSTORE_PASSWORD:  ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_PASSWORD:       ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          echo "$PLAY_UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          make dist-android-play \
            ANDROID_BUILD_TOOLS="${ANDROID_BUILD_TOOLS}" \
            ANDROID_PLATFORM_VER="${ANDROID_PLATFORM_VER}" \
            RELEASE_VERSION=${{ needs.prepare.outputs.version }} \
            PLAY_KEYSTORE="$RUNNER_TEMP/upload.jks" \
            PLAY_KEY_ALIAS="$PLAY_KEY_ALIAS" \
            PLAY_STORE_PASS="$PLAY_KEYSTORE_PASSWORD" \
            PLAY_KEY_PASS="$PLAY_KEY_PASSWORD"
      # The pack inside these artifacts is Glory of Rome, which is ours. The guard the
      # other platforms run is about King's Bounty's DOS-extracted pack: check it is not
      # in here rather than checking for any pack at all.
      - name: Verify no King's Bounty pack in the Android artifacts
        run: |
          set -e
          for f in dist/*.apk dist/*.aab; do
            [ -e "$f" ] || continue
            if unzip -l "$f" | grep -q "kings-bounty"; then
              echo "$f contains the King's Bounty pack"; exit 1
            fi
          done
      # The AAB is only built and uploaded as an artifact here. The push to Play happens in
      # publish-play, which waits for the GitHub Release first: a build failing in parallel
      # with this one could otherwise land on Play after the release had broken.
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            dist/*.apk
            dist/*.aab

  publish:
    name: tag + publish GitHub Release
    needs: [prepare, build-linux-windows, build-mac, build-web, build-android, build-ios]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.prepare.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-merged
          merge-multiple: true
      - run: ls -la dist-merged/
      # The two publishing steps, and only these, are what `dry_run` withholds. Everything
      # before them still runs, so a dry run proves the build and the packaging without
      # consuming a release number or putting anything in front of a user.
      - name: Create release-N tag at the captured commit
        if: ${{ !inputs.dry_run }}
        env:
          V: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "release-$V" "$SHA"
          git push origin "release-$V"
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ needs.prepare.outputs.version }}
          name: release-${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: dist-merged/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false

  publish-play:
    # Gated on `publish`, not merely on the builds: the GitHub Release is not a platform
    # build, and shipping an AAB labelled release-N for a release that does not exist is
    # exactly what waiting on it prevents.
    #
    # `!inputs.dry_run` is load-bearing, not decorative: without it a dry run would still
    # ship a build to the internal track, the outcome dry_run exists to prevent. On a
    # push, `inputs` is empty and the expression is falsey, which is why it is safe at
    # job level.
    if: ${{ !inputs.dry_run && needs.publish.result == 'success' }}
    name: publish AAB to the Play internal track
    needs: [prepare, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Download the android artifact (contains the AAB)
        uses: actions/download-artifact@v8
        with:
          name: android
          path: dist
      - name: Gate on the publish secret + a built AAB
        id: gate
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          aab=$(find dist -maxdepth 1 -name '*.aab' | head -1)
          if [ -n "$SA" ] && [ -n "$aab" ]; then
            echo "go=true"   >> "$GITHUB_OUTPUT"
            echo "aab=$aab"  >> "$GITHUB_OUTPUT"
          else
            echo "go=false"  >> "$GITHUB_OUTPUT"
            echo "Skipping Play publish (secret: $([ -n "$SA" ] && echo yes || echo no); AAB: $([ -n "$aab" ] && echo yes || echo no))."
          fi
      # Pinned to the v1.1.5 commit SHA (not the mutable tag) so a retagged upstream release
      # cannot silently change what runs against the signing key.
      - name: Publish AAB to the Play internal track
        if: steps.gate.outputs.go == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5  # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # The mobile app is Glory of Rome, not the repository name.
          packageName: com.danheskett.gloryofrome
          releaseFiles: ${{ steps.gate.outputs.aab }}
          track: internal
          status: completed
          releaseName: release-${{ needs.prepare.outputs.version }}

  publish-testflight:
    # Same gating as publish-play, and for the same reason: an .ipa labelled
    # release-N must not reach TestFlight for a release that does not exist.
    if: ${{ !inputs.dry_run && needs.publish.result == 'success' }}
    name: upload .ipa to App Store Connect
    needs: [prepare, publish]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Download the ios artifact (contains the .ipa)
        uses: actions/download-artifact@v8
        with:
          name: ios
          path: dist
      - name: Gate on the API-key secrets + a signed .ipa
        id: gate
        env:
          K: ${{ secrets.ASC_KEY_P8 }}
          I: ${{ secrets.ASC_KEY_ID }}
          S: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ipa=$(find dist -maxdepth 1 -name '*.ipa' | head -1)
          signed=false
          if [ -n "$ipa" ] && unzip -l "$ipa" | grep -q '_CodeSignature'; then signed=true; fi
          if [ -n "$K" ] && [ -n "$I" ] && [ -n "$S" ] && [ "$signed" = true ]; then
            echo "go=true"  >> "$GITHUB_OUTPUT"
            echo "ipa=$ipa" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Skipping App Store upload (key: $([ -n "$K" ] && echo yes || echo no); signed .ipa: $signed)."
          fi
      # altool finds the key by convention: AuthKey_<KeyID>.p8 under
      # ~/.appstoreconnect/private_keys.
      - name: Install the App Store Connect API key
        if: steps.gate.outputs.go == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      # Validate before uploading: it catches the ITMS-* rejections (icon,
      # duplicate build number, missing plist keys) without burning the build
      # number, and says far more clearly what is wrong.
      - name: Validate the .ipa against App Store rules
        if: steps.gate.outputs.go == 'true'
        env:
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --validate-app -f "${{ steps.gate.outputs.ipa }}" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Upload the .ipa to App Store Connect
        if: steps.gate.outputs.go == 'true'
        env:
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f "${{ steps.gate.outputs.ipa }}" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ needs.prepare.outputs.version }}. Apple takes ~5-15 min to process it before it appears in TestFlight."
      - name: Remove the API key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys

  testflight-notes:
    if: ${{ !inputs.dry_run && needs.publish-testflight.result == 'success' }}
    name: attach TestFlight release notes
    needs: [prepare, build-ios, publish-testflight]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Gate on the API-key secrets
        id: gate
        env:
          K: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$K" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Attach notes and report tester distribution
        if: steps.gate.outputs.go == 'true'
        env:
          ASC_KEY_P8:    ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID:     com.danheskett.gloryofrome
          BUILD_VERSION: ${{ needs.build-ios.outputs.build }}
          NOTES: |
            release-${{ needs.prepare.outputs.version }}

            ${{ github.event.head_commit.message }}
        run: |
          python3 -m pip install --quiet cryptography
          python3 scripts/testflight_notes.py

  # ---------------------------------------------------------------------------
  # Submit the release to App Review, so a merge to main reaches the App Store
  # without a second, manual action.
  #
  # This runs AFTER testflight-notes, not in parallel with it: both PATCH the
  # same version's localization, and testflight-notes also waits out Apple's
  # 5-15 minute processing window, which this job needs to have finished anyway
  # (there is no build to attach until it has).
  #
  # Apple allows exactly ONE submission in flight per app. --skip-if-busy makes
  # that a no-op with an explanatory line rather than a failure: the release
  # itself succeeded, and the next one carries the change. Without it, merging
  # twice inside a review cycle would red a release for nothing being wrong.
  #
  # `store-release.yml` remains the way to submit a SPECIFIC build on demand.
  # Play's public tracks are not automated at all: release.yml pushes to the
  # internal track and the rest of Play is console work.
  # ---------------------------------------------------------------------------
  submit-appstore:
    # Gated on the UPLOAD succeeding, not on testflight-notes. It is sequenced
    # after testflight-notes (that job waits out Apple's processing window, and
    # ordering keeps two jobs off the same app at once), but a failure there must
    # not veto the submission: the two touch different resources entirely --
    # betaBuildLocalizations for TestFlight's "What to Test", against
    # appStoreVersionLocalizations for the public listing. Apple's API also
    # returns the occasional spurious 401, and a flaky note is no reason to hold
    # a release back.
    # Opt-in, and deliberately so. A merge to main should refresh TestFlight,
    # never put the app in front of App Review: that is a decision, it takes a
    # review cycle to undo, and Apple allows only one submission in flight.
    # Run this workflow by hand with submit_for_review ticked, or use
    # store-release.yml, which exists for exactly this.
    if: ${{ inputs.submit_for_review && !inputs.dry_run && !cancelled() && needs.publish-testflight.result == 'success' }}
    name: submit the build to App Review
    needs: [prepare, build-ios, publish-testflight, testflight-notes]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install the JWT dependency
        run: python3 -m pip install --quiet cryptography
      - name: Gate on the API-key secrets
        id: gate
        env:
          K: ${{ secrets.ASC_KEY_P8 }}
          I: ${{ secrets.ASC_KEY_ID }}
          S: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -n "$K" ] && [ -n "$I" ] && [ -n "$S" ]; then echo "go=true" >> "$GITHUB_OUTPUT";
          else echo "go=false" >> "$GITHUB_OUTPUT"; echo "No ASC_* secrets; skipping."; fi
      # Order matters and is the reverse of Play's, the same way store-release.yml
      # does it: Apple hangs the listing off a VERSION record, so the version has
      # to exist before there is anything to write a description or screenshots
      # onto. Pushing the listing first fails with "no editable version".
      - name: Create the version and attach the build
        if: steps.gate.outputs.go == 'true'
        env:
          ASC_KEY_P8:    ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD: ${{ needs.build-ios.outputs.build }}
        run: |
          # "What's New" defaults to a standard line inside asc_release.py. It is
          # deliberately not the commit subject: that is written for developers,
          # not for customers, and it would put text like
          # "ios: submit each release to App Review automatically (#89)" on the
          # public App Store page.
          python3 scripts/asc_release.py release --build "$BUILD" --skip-if-busy
      # Pushed from the repo, so the description and screenshots Apple reviews are
      # the ones committed here rather than whatever was last typed into the
      # console.
      - name: Push the store listing
        if: steps.gate.outputs.go == 'true'
        env:
          ASC_KEY_P8:    ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # --skip-if-busy for the same reason the steps either side of it carry
        # it: when a version is already in review there is no editable version to
        # write a listing onto, and the whole job has to no-op together.
        run: python3 scripts/asc_release.py listing --skip-if-busy
      - name: Submit for review
        if: steps.gate.outputs.go == 'true'
        env:
          ASC_KEY_P8:    ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD: ${{ needs.build-ios.outputs.build }}
        run: |
          python3 scripts/asc_release.py release \
            --build "$BUILD" --submit --skip-if-busy
