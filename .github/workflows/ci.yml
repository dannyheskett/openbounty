name: ci

# Thin caller. All logic lives in dannyheskett/.github, shared by every game repo.
# Check names in this repo are "ci / <platform>".
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: dannyheskett/.github/.github/workflows/game-ci.yml@v2
    with:
      platforms: '["linux","windows","mac","web"]'
